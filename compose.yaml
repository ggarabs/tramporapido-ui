services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_TASK_API_URL: ${NEXT_PUBLIC_TASK_API_URL:?Defina a URL do task-service}
        NEXT_PUBLIC_USER_API_URL: ${NEXT_PUBLIC_USER_API_URL:?Defina a URL do user-service}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
